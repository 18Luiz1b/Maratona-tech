<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Dashboard: Verdade ou Fake?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Chart.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  
  <style>
    :root {
      --primary-purple: #5c3ce2;
      --bg-gradient: linear-gradient(135deg, #d8b4fe 0%, #fbc2eb 100%);
      --bg-window: #ffffff;
      --text-color: #2b2b52;
      --font-family: 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Moldura estilo Mockup do Exemplo */
    .app-window {
      background-color: var(--bg-window);
      width: 100%;
      max-width: 960px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(92, 60, 226, 0.2);
      display: flex;
      overflow: hidden;
      border: 4px solid #ffffff;
    }

    /* Sidebar Lateral */
    .sidebar {
      background: #fafafa;
      width: 65px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      gap: 18px;
      border-right: 2px solid #f0f0f0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #a0aec0;
      transition: all 0.2s ease;
    }

    .icon-btn.active, .icon-btn:hover {
      background-color: #e0e7ff;
      color: var(--primary-purple);
    }

    /* Conteúdo Principal */
    .main-content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Topbar Roxa */
    .topbar {
      background-color: var(--primary-purple);
      border-radius: 16px;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #ffffff;
    }

    .topbar h1 {
      font-size: 19px;
      font-weight: 800;
    }

    .filter-wrapper select {
      background: #ffffff;
      color: #2b2b52;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: var(--font-family);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      outline: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Gráficos Lado a Lado */
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .chart-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #f0f0f0;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .chart-card h3 {
      font-size: 12px;
      color: #718096;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .chart-card h2 {
      font-size: 15px;
      color: var(--text-color);
      font-weight: 800;
      margin-bottom: 16px;
    }

    .chart-box {
      position: relative;
      height: 260px;
      width: 100%;
    }

    @media (max-width: 768px) {
      .app-window {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        flex-direction: row;
        justify-content: center;
        padding: 10px;
        border-right: none;
        border-bottom: 2px solid #f0f0f0;
      }
      .charts-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="app-window">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="icon-btn active">🏠</div>
    <div class="icon-btn">📊</div>
    <div class="icon-btn">🥧</div>
    <div class="icon-btn">⚙️</div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <header class="topbar">
      <h1>Meu Dashboard: Verdade ou Fake?</h1>
      <div class="filter-wrapper">
        <select id="channelFilter" onchange="updateDashboard()">
          <option value="all">Todos</option>
          <option value="social">Apenas Redes Sociais / Vídeos</option>
          <option value="none">Não costumo acompanhar notícias</option>
        </select>
      </div>
    </header>

    <div class="charts-row">
      <!-- Gráfico 1: Pizza -->
      <div class="chart-card">
        <h3>Gráfico 1</h3>
        <h2>Onde a turma consome notícias?</h2>
        <div class="chart-box">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <!-- Gráfico 2: Barras -->
      <div class="chart-card">
        <h3>Gráfico 2</h3>
        <h2>Reação a um vídeo suspeito</h2>
        <div class="chart-box">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // Os 21 registros exatos coletados na sua planilha
  const rawData = [
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Acreditei e comentei/compartilhei" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Não Acompanha", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Redes Sociais", reacao: "Fiquei na dúvida e fui pesquisar no Google" },
    { canal: "Não Acompanha", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Ignorei" },
    { canal: "Redes Sociais", reacao: "Acreditei e comentei/compartilhei" }
  ];

  let pieChartInstance = null;
  let barChartInstance = null;

  function updateDashboard() {
    const filter = document.getElementById("channelFilter").value;
    
    let filteredData = rawData;
    if (filter === "social") {
      filteredData = rawData.filter(d => d.canal === "Redes Sociais");
    } else if (filter === "none") {
      filteredData = rawData.filter(d => d.canal === "Não Acompanha");
    }

    // Contagens Gráfico 1
    const countSocial = filteredData.filter(d => d.canal === "Redes Sociais").length;
    const countNone = filteredData.filter(d => d.canal === "Não Acompanha").length;

    // Contagens Gráfico 2
    const countShare = filteredData.filter(d => d.reacao === "Acreditei e comentei/compartilhei").length;
    const countSearch = filteredData.filter(d => d.reacao === "Fiquei na dúvida e fui pesquisar no Google").length;
    const countIgnore = filteredData.filter(d => d.reacao === "Ignorei").length;

    // 1. Renderizar Gráfico de Pizza
    const ctxPie = document.getElementById('pieChart').getContext('2d');
    if (pieChartInstance) pieChartInstance.destroy();

    pieChartInstance = new Chart(ctxPie, {
      type: 'pie',
      data: {
        labels: ['Redes Sociais / Vídeos', 'Não acompanha notícias'],
        datasets: [{
          data: [countSocial, countNone],
          backgroundColor: ['#2563eb', '#f59e0b']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { font: { family: 'Nunito', size: 11, weight: '700' } }
          }
        }
      }
    });

    // 2. Renderizar Gráfico de Barras
    const ctxBar = document.getElementById('barChart').getContext('2d');
    if (barChartInstance) barChartInstance.destroy();

    barChartInstance = new Chart(ctxBar, {
      type: 'bar',
      data: {
        labels: ['Acreditaram e Compartilharam', 'Pesquisaram no Google', 'Ignorei'],
        datasets: [{
          data: [countShare, countSearch, countIgnore],
          backgroundColor: ['#7c3aed', '#38bdf8', '#cbd5e1'],
          borderRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#f1f5f9' } },
          x: { grid: { display: false }, ticks: { font: { family: 'Nunito', size: 10, weight: '700' } } }
        }
      }
    });
  }

  window.onload = function() {
    updateDashboard();
  };
</script>
</body>
</html>
