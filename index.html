<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Dashboard: Verdade ou Fake?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="window-container">
  <!-- Sidebar lateral -->
  <aside class="sidebar">
    <div class="icon-btn active">🏠</div>
    <div class="icon-btn">📊</div>
    <div class="icon-btn">🥧</div>
    <div class="icon-btn">⚙️</div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <!-- Topbar Roxa -->
    <header class="topbar">
      <h1>Meu Dashboard: Verdade ou Fake?</h1>
      <div class="filter-wrapper">
        <select id="channelFilter" onchange="updateDashboard()">
          <option value="all">Todos</option>
          <option value="social">Apenas Redes Sociais / Vídeos</option>
          <option value="none">Não costumo acompanhar notícias</option>
        </select>
      </div>
    </header>

    <!-- Gráficos Lado a Lado -->
    <div class="charts-row">
      <!-- Card Gráfico 1 -->
      <div class="chart-card">
        <h3>Gráfico 1</h3>
        <h2>Onde a turma consome notícias?</h2>
        <div class="chart-box">
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <!-- Card Gráfico 2 -->
      <div class="chart-card">
        <h3>Gráfico 2</h3>
        <h2>Reação ao vídeo do canguru</h2>
        <div class="chart-box">
          <canvas id="barChart"></canvas>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
